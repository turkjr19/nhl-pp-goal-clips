<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NHL PP Clips | Ridgebacks</title>

<style>
:root {
  --navy: #173e70;
  --orange: #df6436;
  --green: #358252;
  --background: #f5f7fa;
  --border: #dfe6ee;
  --muted: #718096;
  --text: #253449;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-width: 0;
  background: var(--background);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
  outline: 3px solid #0077c8;
  outline-offset: 2px;
}

.container {
  width: min(1080px, calc(100% - 32px));
  margin-inline: auto;
}

/* HEADER */

header {
  background: white;
  border-bottom: 3px solid var(--orange);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 82px;
}

.logo {
  width: 64px;
  height: 64px;
  object-fit: contain;
}

.brand {
  color: var(--navy);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: 1px;
}

/* PAGE TITLE */

.hero {
  padding: 28px 0 22px;
}

.hero h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(25px, 5vw, 36px);
  font-weight: 800;
  letter-spacing: -0.7px;
  line-height: 1.2;
}

.hero p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
}

/* LIBRARY */

.library {
  background: white;
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  margin-bottom: 40px;
  box-shadow: 0 4px 20px rgba(20, 50, 80, .04);
}

.library-header {
  padding: 22px 22px 15px;
}

.library-header h2 {
  margin: 0;
  color: var(--navy);
  font-size: 21px;
  font-weight: 800;
}

/* FILTERS */

.filters {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr)
    minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 10px;
  padding: 0 22px 20px;
}

.field {
  display: flex;
  flex-direction: column;
  min-width: 0;
  gap: 6px;
}

.field label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
}

.field input,
.field select {
  width: 100%;
  min-width: 0;
  height: 43px;
  padding: 0 11px;
  border: 1px solid #d3dce7;
  border-radius: 7px;
  background: white;
  color: var(--text);
  font-size: 13px;
}

.field input[type="date"] {
  min-width: 0;
  max-width: 100%;
  -webkit-appearance: none;
  appearance: none;
  color-scheme: light;
}

.clear-button {
  height: 43px;
  align-self: end;
  padding: 0 15px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
}

.clear-button:hover {
  background: #f0f5fa;
}

/* VIEW BAR */

.view-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 22px;
  background: #f8fafc;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.view-buttons {
  display: flex;
  gap: 7px;
}

.view-button {
  padding: 9px 14px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
}

.view-button.active {
  background: var(--navy);
  border-color: var(--navy);
  color: white;
}

.result-count {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

/* DESKTOP TABLE */

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #f8fafc;
}

th {
  padding: 14px 18px;
  text-align: left;
  color: var(--muted);
  font-size: 11px;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: .5px;
}

td {
  padding: 15px 18px;
  border-top: 1px solid var(--border);
  font-size: 13px;
}

tbody tr:hover {
  background: #f8fbfe;
}

.date-main {
  color: var(--navy);
  font-size: 13px;
  font-weight: 800;
}

.date-year {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}

.team {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 48px;
  padding: 8px 10px;
  border-radius: 7px;
  background: #edf2f7;
  color: var(--navy);
  font-size: 12px;
  font-weight: 800;
}

.team.pp {
  background: #eaf5ed;
  color: var(--green);
}

.watch-button {
  border: none;
  border-radius: 7px;
  padding: 10px 14px;
  background: var(--orange);
  color: white;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.watch-button:hover {
  background: var(--navy);
}

.save-button {
  width: 38px;
  height: 38px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: #8492a4;
  font-size: 23px;
}

.save-button.saved {
  color: var(--orange);
  background: #fff4ee;
  border-color: #f0c5b5;
}

/* EMPTY STATE */

.empty {
  padding: 45px 15px;
  text-align: center;
}

.empty strong {
  display: block;
  color: var(--navy);
  font-size: 15px;
  letter-spacing: .4px;
}

.empty p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 12px;
}

/* PAGINATION */

.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 15px 22px;
  border-top: 1px solid var(--border);
}

.page-info {
  color: var(--muted);
  font-size: 12px;
}

.page-buttons {
  display: flex;
  gap: 7px;
}

.page-button {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: white;
  color: var(--navy);
  font-size: 12px;
  font-weight: 700;
}

/* VIDEO PLAYER */

.video-modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: rgba(0, 12, 28, .9);
}

.video-modal.open {
  display: flex;
}

.video-box {
  width: min(100%, 1000px);
  overflow: hidden;
  border-radius: 10px;
  background: black;
}

.video-header {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  height: 45px;
  padding: 0 10px;
  background: var(--navy);
}

.video-close {
  border: none;
  background: transparent;
  color: white;
  font-size: 29px;
  line-height: 1;
  padding: 5px 10px;
}

.video-player {
  display: block;
  width: 100%;
  max-height: 75dvh;
  background: black;
}

.video-error {
  display: none;
  padding: 14px;
  background: #fff2ef;
  color: #b42318;
  font-size: 12px;
}

/* FOOTER */

footer {
  padding: 26px 12px 32px;
  background: white;
  border-top: 1px solid var(--border);
  text-align: center;
}

.footer-title {
  color: var(--navy);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .5px;
}

.contributors {
  margin-top: 10px;
  color: var(--muted);
  font-size: 11px;
}

.contributors a {
  color: var(--navy);
  font-weight: 700;
  text-decoration: none;
}

.contributors a:hover {
  text-decoration: underline;
}

/* MOBILE - IPHONE / ANDROID */

@media (max-width: 650px) {

  .container {
    width: calc(100% - 20px);
  }

  .header-inner {
    min-height: 66px;
    gap: 9px;
  }

  .logo {
    width: 49px;
    height: 49px;
  }

  .brand {
    font-size: 16px;
  }

  .hero {
    padding: 22px 3px 17px;
  }

  .hero h1 {
    font-size: 27px;
    letter-spacing: -.5px;
  }

  .hero p {
    font-size: 12px;
    margin-top: 5px;
  }

  .library {
    border-radius: 10px;
    margin-bottom: 25px;
  }

  .library-header {
    padding: 16px 14px 13px;
  }

  .library-header h2 {
    font-size: 19px;
  }

  .filters {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
    padding: 0 14px 16px;
  }

  .search-field {
    grid-column: 1 / -1;
  }

  .field input,
  .field select {
    height: 44px;
    font-size: 13px;
    padding: 0 9px;
  }

  .field label {
    font-size: 10px;
  }

  .clear-button {
    grid-column: 1 / -1;
    height: 39px;
  }

  .view-bar {
    padding: 11px 14px;
    flex-wrap: wrap;
  }

  .view-button {
    padding: 9px 12px;
    font-size: 11px;
  }

  .result-count {
    font-size: 11px;
  }

  /* COMPACT MOBILE ROWS */

  table, tbody {
    display: block;
    width: 100%;
  }

  thead {
    display: none;
  }

  tbody tr {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    grid-template-rows: auto auto;
    align-items: center;
    gap: 10px 8px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  td {
    display: block;
    min-width: 0;
    padding: 0;
    border: none;
  }

  /* Date on top left */

  td:nth-child(1) {
    grid-column: 1 / 3;
    grid-row: 1;
  }

  .date-main {
    font-size: 13px;
  }

  .date-year {
    display: inline;
    font-size: 11px;
  }

  /* Team labels */

  td:nth-child(2) {
    grid-column: 1;
    grid-row: 2;
  }

  td:nth-child(3) {
    grid-column: 2;
    grid-row: 2;
  }

  td:nth-child(2)::before,
  td:nth-child(3)::before {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 700;
  }

  td:nth-child(2)::before {
    content: "PP TEAM";
  }

  td:nth-child(3)::before {
    content: "PK TEAM";
  }

  .team {
    min-width: 43px;
    padding: 7px 8px;
    font-size: 11px;
  }

  /* Watch on bottom right */

  td:nth-child(4) {
    grid-column: 3;
    grid-row: 2;
  }

  .watch-button {
    padding: 10px 11px;
    font-size: 10px;
  }

  /* Save on top right */

  td:nth-child(5) {
    grid-column: 3;
    grid-row: 1;
    text-align: right;
  }

  .save-button {
    width: 34px;
    height: 34px;
    font-size: 21px;
  }

  tbody tr:has(td[colspan]) {
    display: block;
  }

  .pagination {
    padding: 13px 14px;
  }

  .page-info {
    font-size: 10px;
  }

  .page-button {
    font-size: 11px;
    padding: 9px 10px;
  }

  .video-modal {
    padding: 7px;
  }

  .footer-title {
    font-size: 10px;
  }
}

/* EXTRA SMALL PHONES */

@media (max-width: 360px) {

  .container {
    width: calc(100% - 14px);
  }

  .hero h1 {
    font-size: 24px;
  }

  .filters {
    gap: 7px;
    padding-inline: 10px;
  }

  tbody tr {
    padding: 12px 10px;
    gap: 8px 5px;
  }

  .watch-button {
    padding: 9px 8px;
  }

  .team {
    min-width: 39px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>
  <div class="container header-inner">

    <img
      src="ridgebacks-logo.png"
      class="logo"
      alt="Ontario Tech Ridgebacks"
    >

    <div class="brand">

    </div>

  </div>
</header>

<!-- PAGE -->

<main class="container">

  <section class="hero">

    <h1>NHL PP Clips</h1>

    <p>
      Browse NHL power-play goals by team and date.
    </p>

  </section>

  <!-- VIDEO LIBRARY -->

  <section class="library">

    <div class="library-header">
      <h2>Video Library</h2>
    </div>

    <!-- FILTERS -->

    <div class="filters">

      <div class="field search-field">

        <label for="search">

        </label>

        <input

      </div>

      <div class="field">

        <input

          id="dateFilter"

      <div class="field">

      <button

    <!-- PAGINATION -->

</main>

<!-- FOOTER -->

<footer>

  </div>

  <div class="contributors">

    Contributors:

      href="https://github.com/turkjr19"

    >Turkjr19</a>

    &nbsp; · &nbsp;

    <a

    >NoahCornish</a>

<!-- VIDEO MODAL -->

<div
  class="video-modal"
  id="videoModal"
  role="dialog"
  aria-modal="true"

  aria-hidden="true"
>

  <div class="video-box">

    <div class="video-header">

      <button
        class="video-close"
        id="closeVideo"
        type="button"
        aria-label="Close video"

        &times;
      </button>

      class="video-player"

      controls
      playsinline

      id="videoError"
      role="alert"

<script>
"use strict";

const $ = id => document.getElementById(id);

let allClips = [];
let filteredClips = [];
let currentPage = 0;
let currentView = "all";
let lastFocus = null;

const PAGE_SIZE = 20;
const STORAGE_KEY = "ridgebacks-saved-clips-v1";

let savedClips = new Set();

try {
  const stored = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if (Array.isArray(stored)) {
    savedClips = new Set(stored);
  }
} catch (error) {
  savedClips = new Set();
}

/* LOCAL DATE HELPERS */

function localDateString(date) {

  const year = date.getFullYear();

  const month = String(
    date.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    date.getDate()
  ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}

/* DEFAULT DATE = YESTERDAY */

function yesterdayString() {

  const date = new Date();

  date.setDate(date.getDate() - 1);

  return localDateString(date);
}

$("dateFilter").value = yesterdayString();

/* SAFE HTML */

function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]
  );
}

/* CSV PARSER */

function parseCSV(text) {

  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {

    const character = text[i];

    if (character === '"') {

      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }

    } else if (character === "," && !quoted) {

      row.push(cell);
      cell = "";

    } else if (
      (character === "\n" || character === "\r") &&
      !quoted
    ) {

      if (
        character === "\r" &&
        text[i + 1] === "\n"
      ) {
        i++;
      }

      row.push(cell);

      if (row.some(value => value.trim())) {
        rows.push(row);
      }

      row = [];
      cell = "";

    } else {

      cell += character;

    }
  }

  row.push(cell);

  if (row.some(value => value.trim())) {
    rows.push(row);
  }

  return rows;
}

/* GET OPPONENT */

function getOpponentTeam(matchup, scoringTeam) {

  if (!matchup || !scoringTeam) {
    return "";
  }

  const teams = matchup.split(
    /\s+(?:@|vs\.?|v\.?|at|-)\s+/i
  );

  if (teams.length !== 2) {
    return "";
  }

  const normalize = value =>
    value.trim().toUpperCase().replace(/\./g, "");

  if (normalize(teams[0]) === normalize(scoringTeam)) {
    return teams[1].trim();
  }

  if (normalize(teams[1]) === normalize(scoringTeam)) {
    return teams[0].trim();
  }

  return "";
}

/* GET VIDEO ID */

function getVideoId(row) {

  let id = String(
    row.video_id ||
    row.videoId ||
    row.brightcove_video_id ||
    ""
  ).trim();

  if (id) {
    return id;
  }

  for (const source of [
    row.player_url,
    row.clip_url
  ]) {

    if (!source) continue;

    try {

      id = new URL(
        source,
        location.href
      ).searchParams.get("videoId") || "";

    } catch (error) {

      const match = String(source).match(
        /[?&]videoId=(\d+)/i
      );

      id = match ? match[1] : "";
    }

    if (id) {
      return id;
    }
  }

  return "";
}

/* VIDEO URL */

function getClipUrl(row) {

  if (row.processed_clip_url) {
    return row.processed_clip_url.trim();
  }

  const id = getVideoId(row);

  if (!id) return "";

  return "videos/" +
    encodeURIComponent(id) +
    ".mp4";
}

/* CLIP KEY */

function clipKey(row) {

  return [
    row.game_date,
    row.team,
    row.pk_team,
    row.videoUrl
  ].join("|");
}

/* FORMAT DATE */

function formatDate(value) {

  const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(
    String(value || "")
  );

  if (!match) {
    return {
      main: value || "Unknown",
      year: ""
    };
  }

  const date = new Date(
    Date.UTC(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    )
  );

  return {
    main: date.toLocaleDateString("en-CA", {
      month: "short",
      day: "numeric",
      timeZone: "UTC"
    }),
    year: match[1]
  };
}

/* FILTER CLIPS */

function applyFilters(resetPage = true) {

  if (resetPage) {
    currentPage = 0;
  }

  const query = $("search")
    .value.trim()
    .toUpperCase();

  const selectedDate = $("dateFilter").value;

  const teamType = $("teamFilter").value;

  filteredClips = allClips.filter(row => {

    /* SAVED FILTER */

    if (
      currentView === "saved" &&
      !savedClips.has(clipKey(row))
    ) {
      return false;
    }

    /* DATE FILTER */

    if (
      selectedDate &&
      row.game_date.slice(0, 10) !== selectedDate
    ) {
      return false;
    }

    /* TEAM FILTER */

    if (!query) {
      return true;
    }

    const pp = (row.team || "").toUpperCase();
    const pk = (row.pk_team || "").toUpperCase();

    if (teamType === "pp") {
      return pp.includes(query);
    }

    if (teamType === "pk") {
      return pk.includes(query);
    }

    return (
      pp.includes(query) ||
      pk.includes(query)
    );

  });

  /* ALWAYS NEWEST FIRST */

  filteredClips.sort((a, b) =>
    (b.game_date || "").localeCompare(
      a.game_date || ""
    )
  );

  renderClips();
}

/* RENDER CLIPS */

function renderClips() {

  const start = currentPage * PAGE_SIZE;

  const rows = filteredClips.slice(
    start,
    start + PAGE_SIZE
  );

  $("resultCount").textContent =
    filteredClips.length +
    (filteredClips.length === 1
      ? " clip found"
      : " clips found");

  /* NO CLIPS */

  if (rows.length === 0) {

    $("clips").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>NO CLIPS AVAILABLE</strong>
            <p>
              No clips match the selected date or filters.
            </p>
          </div>
        </td>
      </tr>
    `;

  } else {

    $("clips").innerHTML = rows.map((row, index) => {

      const date = formatDate(row.game_date);
      const isSaved = savedClips.has(clipKey(row));
      const rowIndex = start + index;

      const videoButton = row.videoUrl
        ? `
          <button
            class="watch-button"
            type="button"
            data-play="${rowIndex}"
          >
            ▶ WATCH
          </button>
        `
        : `<span>Unavailable</span>`;

      return `
        <tr>

          <td>
            <div class="date-main">
              ${escapeHTML(date.main)}
            </div>
            <div class="date-year">
              ${escapeHTML(date.year)}
            </div>
          </td>

          <td>
            <span class="team pp">
              ${escapeHTML(row.team || "—")}
            </span>
          </td>

          <td>
            <span class="team">
              ${escapeHTML(row.pk_team || "—")}
            </span>
          </td>

          <td>
            ${videoButton}
          </td>

          <td>
            <button
              class="save-button ${isSaved ? "saved" : ""}"
              type="button"
              data-save="${rowIndex}"
              aria-label="${isSaved
                ? "Remove saved clip"
                : "Save clip"}"
              aria-pressed="${isSaved}"
            >
              ${isSaved ? "★" : "☆"}
            </button>
          </td>

        </tr>
      `;

    }).join("");
  }

  $("pageInfo").textContent =
    filteredClips.length
      ? `Showing ${start + 1}–${
          Math.min(
            start + PAGE_SIZE,
            filteredClips.length
          )
        } of ${filteredClips.length}`
      : "No results";

  $("previousPage").disabled =
    currentPage === 0;

  $("nextPage").disabled =
    start + PAGE_SIZE >= filteredClips.length;
}

/* OPEN VIDEO */

function openVideo(url) {

  if (!url) return;

  lastFocus = document.activeElement;

  const modal = $("videoModal");
  const player = $("clipPlayer");
  const error = $("videoError");

  error.style.display = "none";
  error.textContent = "";

  player.pause();
  player.removeAttribute("src");
  player.load();

  player.onerror = function() {

    error.textContent =
      "This clip could not be loaded. " +
      "Check the MP4 file in the videos folder.";

    error.style.display = "block";
  };

  player.src = url;

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";

  $("closeVideo").focus();

  player.load();

  player.play().catch(() => {});
}

/* CLOSE VIDEO */

function closeVideo() {

  const modal = $("videoModal");

  if (!modal.classList.contains("open")) {
    return;
  }

  const player = $("clipPlayer");

  player.pause();
  player.removeAttribute("src");
  player.load();

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");

  document.body.style.overflow = "";

  if (lastFocus && lastFocus.isConnected) {
    lastFocus.focus();
  }
}

/* SAVE CLIPS */

function toggleSaved(row) {

  const key = clipKey(row);

  if (savedClips.has(key)) {
    savedClips.delete(key);
  } else {
    savedClips.add(key);
  }

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify([...savedClips])
    );

  } catch (error) {
    // Storage may be unavailable.
  }

  applyFilters(false);
}

/* TABLE BUTTONS */

$("clips").addEventListener("click", event => {

  const play = event.target.closest("[data-play]");

  if (play) {

    const row = filteredClips[
      Number(play.dataset.play)
    ];

    if (row) {
      openVideo(row.videoUrl);
    }

    return;
  }

  const save = event.target.closest("[data-save]");

  if (save) {

    const row = filteredClips[
      Number(save.dataset.save)
    ];

    if (row) {
      toggleSaved(row);
    }
  }
});

/* SEARCH EVENTS */

$("search").addEventListener(
  "input",
  () => applyFilters()
);

$("dateFilter").addEventListener(
  "change",
  () => applyFilters()
);

$("teamFilter").addEventListener(
  "change",
  () => applyFilters()
);

/* CLEAR FILTERS */

$("clearButton").addEventListener("click", () => {

  $("search").value = "";
  $("dateFilter").value = "";
  $("teamFilter").value = "both";

  applyFilters();
});

/* ALL CLIPS */

$("allButton").addEventListener("click", () => {

  currentView = "all";

  $("allButton").classList.add("active");
  $("savedButton").classList.remove("active");

  applyFilters();
});

/* SAVED CLIPS */

$("savedButton").addEventListener("click", () => {

  currentView = "saved";

  $("savedButton").classList.add("active");
  $("allButton").classList.remove("active");

  applyFilters();
});

/* PAGINATION */

$("previousPage").addEventListener("click", () => {

  if (currentPage > 0) {
    currentPage--;
    renderClips();
  }
});

$("nextPage").addEventListener("click", () => {

  if (
    (currentPage + 1) * PAGE_SIZE <
    filteredClips.length
  ) {
    currentPage++;
    renderClips();
  }
});

/* VIDEO EVENTS */

$("closeVideo").addEventListener(
  "click",
  closeVideo
);

$("videoModal").addEventListener("click", event => {

  if (event.target === $("videoModal")) {
    closeVideo();
  }
});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeVideo();
  }

  if (
    event.key === "Tab" &&
    $("videoModal").classList.contains("open")
  ) {

    const focusable = [
      $("closeVideo"),
      $("clipPlayer")
    ];

    const index = focusable.indexOf(
      document.activeElement
    );

    if (event.shiftKey && index <= 0) {

      event.preventDefault();
      focusable[1].focus();

    } else if (!event.shiftKey && index === 1) {

      event.preventDefault();
      focusable[0].focus();
    }
  }
});

/* LOAD CSV */

async function loadClips() {

  try {

    const response = await fetch(
      "pp_goal_clips.csv?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("Could not load CSV");
    }

    const text = (
      await response.text()
    ).replace(/^\uFEFF/, "");

    const records = parseCSV(text);

    if (records.length < 2) {
      allClips = [];
      applyFilters();
      return;
    }

    const headers = records.shift().map(
      value => value.trim()
    );

    allClips = records.map(values => {

      const row = Object.fromEntries(
        headers.map((header, index) => [
          header,
          (values[index] || "").trim()
        ])
      );

      row.pk_team = getOpponentTeam(
        row.matchup,
        row.team
      );

      row.videoUrl = getClipUrl(row);

      return row;
    });

    applyFilters();

  } catch (error) {

    $("resultCount").textContent =
      "Unable to load clips";

    $("clips").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>COULD NOT LOAD CLIPS</strong>
            <p>
              Check that pp_goal_clips.csv
              is in the website folder.
            </p>
          </div>
        </td>
      </tr>
    `;

    $("pageInfo").textContent = "Unavailable";
    $("previousPage").disabled = true;
    $("nextPage").disabled = true;
  }
}

/* START */

loadClips();

</script>
</body>
</html>
