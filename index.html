<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NHL PP Clips | Ridgebacks</title>

<style>
:root {
  --navy: #173e70;
  --orange: #df6436;
  --green: #267647;
  --bg: #f5f7fa;
  --border: #e0e7ef;
  --muted: #6e7f94;
  --text: #24354a;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-width: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

button, input, select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .42;
  cursor: not-allowed;
}

:focus-visible {
  outline: 3px solid #1684c9;
  outline-offset: 2px;
}

.container {
  width: min(1080px, calc(100% - 32px));
  margin: auto;
}

/* HEADER */

header {
  background: #fff;
  border-bottom: 3px solid var(--orange);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 78px;
}

.logo {
  width: 62px;
  height: 62px;
  object-fit: contain;
}

.brand {
  color: var(--navy);
  font-size: 19px;
  font-weight: 850;
  letter-spacing: 1px;
}

/* TITLE */

.hero {
  padding: 26px 0 20px;
}

.hero h1 {
  margin: 0;
  color: var(--navy);
  font-size: clamp(25px, 4.5vw, 34px);
  font-weight: 820;
  letter-spacing: -.7px;
}

/* VIDEO LIBRARY */

.library {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
  margin-bottom: 40px;
  box-shadow: 0 4px 22px #193c6010;
}

.library-header {
  padding: 20px 22px 15px;
}

.library-header h2 {
  margin: 0;
  color: var(--navy);
  font-size: 21px;
}

/* FILTERS */

.filters {
  display: grid;
  grid-template-columns:
    minmax(0, 1.5fr)
    minmax(0, 1fr)
    minmax(0, 1fr)
    auto;
  gap: 10px;
  padding: 0 22px 19px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field label {
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .35px;
  color: var(--muted);
}

.field input,
.field select {
  width: 100%;
  min-width: 0;
  height: 44px;
  border: 1px solid #d3dce7;
  border-radius: 8px;
  padding: 0 11px;
  background: #fff;
  color: var(--text);
  font-size: 13px;
}

.field input[type="date"] {
  min-width: 0;
  max-width: 100%;
  color-scheme: light;
}

.clear-button {
  align-self: end;
  height: 44px;
  padding: 0 15px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: var(--navy);
  font-size: 12px;
  font-weight: 750;
}

.clear-button:hover {
  background: #f1f6fa;
}

/* VIEW BAR */

.view-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 22px;
  background: #f8fafc;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.view-buttons {
  display: flex;
  gap: 7px;
}

.view-button {
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  color: var(--muted);
  font-size: 12px;
  font-weight: 750;
  padding: 9px 14px;
}

.view-button.active {
  background: var(--navy);
  border-color: var(--navy);
  color: #fff;
}

.result-count {
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}

/* TABLE */

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #fafbfd;
}

th {
  text-align: left;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .6px;
  text-transform: uppercase;
  padding: 13px 19px;
}

td {
  border-top: 1px solid var(--border);
  padding: 12px 19px;
  font-size: 13px;
}

tbody tr:hover {
  background: #f9fbfe;
}

.date-main {
  font-weight: 800;
  color: var(--navy);
  font-size: 13px;
}

.date-year {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

/* NHL TEAM LOGOS */

.team-pill {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 5px 10px 5px 6px;
  border: 1px solid #e2e9f0;
  background: #f4f7fa;
  border-radius: 9px;
  min-height: 42px;
  color: var(--navy);
  font-weight: 850;
  font-size: 12px;
  white-space: nowrap;
}

.team-pill.pp {
  background: #f0f8f2;
  border-color: #deebdf;
  color: var(--green);
}

.team-logo {
  display: block;
  width: 30px;
  height: 30px;
  object-fit: contain;
  flex-shrink: 0;
}

.team-fallback {
  display: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #e3eaf2;
  align-items: center;
  justify-content: center;
  color: var(--navy);
  font-size: 9px;
  font-weight: 800;
}

.team-pill.logo-failed .team-logo {
  display: none;
}

.team-pill.logo-failed .team-fallback {
  display: flex;
}

/* BUTTONS */

.watch-button {
  border: 0;
  border-radius: 8px;
  background: var(--orange);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  padding: 11px 15px;
  white-space: nowrap;
}

.watch-button:hover {
  background: var(--navy);
}

.save-button {
  border: 1px solid var(--border);
  background: #fff;
  color: #8a99a9;
  border-radius: 8px;
  width: 39px;
  height: 39px;
  font-size: 24px;
  line-height: 1;
}

.save-button.saved {
  color: var(--orange);
  border-color: #f1c7b7;
  background: #fff6f1;
}

/* EMPTY STATE */

.empty {
  padding: 46px 16px;
  text-align: center;
}

.empty strong {
  display: block;
  color: var(--navy);
  font-size: 15px;
  letter-spacing: .4px;
}

.empty p {
  color: var(--muted);
  font-size: 12px;
  margin: 8px 0 0;
}

/* PAGINATION */

.pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 14px 22px;
  border-top: 1px solid var(--border);
}

.page-info {
  font-size: 12px;
  color: var(--muted);
}

.page-buttons {
  display: flex;
  gap: 7px;
}

.page-button {
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #fff;
  color: var(--navy);
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 750;
}

/* VIDEO PLAYER */

.video-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: #000d1eea;
  padding: 12px;
}

.video-modal.open {
  display: flex;
}

.video-box {
  width: min(100%, 1000px);
  border-radius: 11px;
  overflow: hidden;
  background: #000;
}

.video-header {
  height: 46px;
  background: var(--navy);
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 0 10px;
}

.video-close {
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 30px;
  padding: 4px 10px;
}

.video-player {
  display: block;
  width: 100%;
  max-height: 75dvh;
  background: #000;
}

.video-error {
  display: none;
  background: #fff2ef;
  color: #a51d14;
  padding: 14px;
  font-size: 12px;
}

/* FOOTER */

footer {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 26px 12px 34px;
  text-align: center;
}

.footer-title {
  font-size: 11px;
  font-weight: 800;
  color: var(--navy);
  letter-spacing: .5px;
}

.contributors {
  margin-top: 10px;
  font-size: 11px;
  color: var(--muted);
}

.contributors a {
  color: var(--navy);
  font-weight: 750;
  text-decoration: none;
}

.contributors a:hover {
  text-decoration: underline;
}

/* TABLET */

@media (max-width: 760px) {

  .filters {
    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr);
  }

  .search-field {
    grid-column: 1 / -1;
  }

  .clear-button {
    grid-column: 1 / -1;
  }
}

/* IPHONE / ANDROID */

@media (max-width: 650px) {

  .container {
    width: calc(100% - 20px);
  }

  .header-inner {
    min-height: 66px;
    gap: 9px;
  }

  .logo {
    width: 49px;
    height: 49px;
  }

  .brand {
    font-size: 16px;
  }

  .hero {
    padding: 20px 3px 16px;
  }

  .hero h1 {
    font-size: 26px;
  }

  .library {
    border-radius: 10px;
    margin-bottom: 25px;
  }

  .library-header {
    padding: 15px 13px 12px;
  }

  .library-header h2 {
    font-size: 19px;
  }

  .filters {
    gap: 9px;
    padding: 0 13px 14px;
  }

  .field input,
  .field select {
    height: 43px;
    padding: 0 9px;
    font-size: 13px;
  }

  .clear-button {
    height: 38px;
  }

  .view-bar {
    padding: 10px 13px;
  }

  .view-button {
    font-size: 11px;
    padding: 9px 12px;
  }

  .result-count {
    font-size: 11px;
  }

  table, tbody {
    display: block;
    width: 100%;
  }

  thead {
    display: none;
  }

  tbody tr {
    display: grid;
    grid-template-columns:
      minmax(0, 1fr)
      minmax(0, 1fr)
      auto;
    grid-template-rows: auto auto;
    align-items: center;
    gap: 10px 8px;
    padding: 12px 13px;
    border-top: 1px solid var(--border);
  }

  td {
    display: block;
    min-width: 0;
    padding: 0;
    border: 0;
  }

  td:nth-child(1) {
    grid-column: 1 / 3;
    grid-row: 1;
  }

  .date-main {
    font-size: 12px;
  }

  .date-year {
    display: inline;
    font-size: 10px;
  }

  td:nth-child(2) {
    grid-column: 1;
    grid-row: 2;
  }

  td:nth-child(3) {
    grid-column: 2;
    grid-row: 2;
  }

  td:nth-child(2)::before,
  td:nth-child(3)::before {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 800;
  }

  td:nth-child(2)::before {
    content: "PP TEAM";
  }

  td:nth-child(3)::before {
    content: "PK TEAM";
  }

  .team-pill {
    min-height: 37px;
    gap: 5px;
    padding: 4px 7px 4px 4px;
    font-size: 11px;
    border-radius: 7px;
  }

  .team-logo,
  .team-fallback {
    width: 25px;
    height: 25px;
  }

  td:nth-child(4) {
    grid-column: 3;
    grid-row: 2;
  }

  .watch-button {
    font-size: 10px;
    padding: 10px;
  }

  td:nth-child(5) {
    grid-column: 3;
    grid-row: 1;
    text-align: right;
  }

  .save-button {
    width: 34px;
    height: 34px;
    font-size: 21px;
  }

  tbody tr:has(td[colspan]) {
    display: block;
  }

  .pagination {
    padding: 12px 13px;
  }

  .page-info {
    font-size: 10px;
  }

  .page-button {
    font-size: 11px;
    padding: 9px 10px;
  }

  .video-modal {
    padding: 7px;
  }

  .footer-title {
    font-size: 10px;
  }
}

/* SMALL PHONES */

@media (max-width: 360px) {

  .container {
    width: calc(100% - 14px);
  }

  .hero h1 {
    font-size: 24px;
  }

  .filters {
    gap: 7px;
    padding-inline: 10px;
  }

  tbody tr {
    padding: 11px 9px;
    gap: 8px 4px;
  }

  .team-pill {
    font-size: 10px;
    gap: 3px;
    padding-right: 5px;
  }

  .team-logo,
  .team-fallback {
    width: 23px;
    height: 23px;
  }

  .watch-button {
    padding: 9px 7px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    transition: none !important;
  }
}
</style>

<body>

<!-- HEADER -->

<header>
  <div class="container header-inner">

    <img
      class="logo"
      src="ridgebacks-logo.png"
      alt="Ontario Tech Ridgebacks logo"
    >

    <div class="brand">

    </div>

  </div>
</header>

<!-- MAIN CONTENT -->

<main class="container">

  </section>

<script>
"use strict";

/* GLOBAL VARIABLES */

const $ = id => document.getElementById(id);

const PAGE_SIZE = 20;
const STORAGE_KEY = "ridgebacks-saved-clips-v1";

let allClips = [];
let filteredClips = [];
let currentPage = 0;
let currentView = "all";
let lastFocus = null;
let savedClips = new Set();

/* LOAD SAVED CLIPS */

try {

  const data = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if (Array.isArray(data)) {
    savedClips = new Set(
      data.filter(x => typeof x === "string")
    );
  }

} catch (error) {
  savedClips = new Set();
}

/* NHL TEAM CODES */

const TEAM_CODES = {
  ANA: "ANA",
  ARI: "UTA",
  ATL: "WPG",
  BOS: "BOS",
  BUF: "BUF",
  CAR: "CAR",
  CBJ: "CBJ",
  CGY: "CGY",
  CHI: "CHI",
  COL: "COL",
  DAL: "DAL",
  DET: "DET",
  EDM: "EDM",
  FLA: "FLA",
  LAK: "LAK",
  LA: "LAK",
  MIN: "MIN",
  MTL: "MTL",
  NJD: "NJD",
  NJ: "NJD",
  NSH: "NSH",
  NYI: "NYI",
  NYR: "NYR",
  OTT: "OTT",
  PHI: "PHI",
  PIT: "PIT",
  SEA: "SEA",
  SJS: "SJS",
  SJ: "SJS",
  STL: "STL",
  TBL: "TBL",
  TB: "TBL",
  TOR: "TOR",
  UTA: "UTA",
  UTAH: "UTA",
  VAN: "VAN",
  VGK: "VGK",
  WSH: "WSH",
  WPG: "WPG",
  WAS: "WSH"
};

/* LOGO CODE */

function logoCode(team) {

  return TEAM_CODES[
    String(team || "").trim().toUpperCase()
  ] || "";

}

/* SAFE HTML */

function escapeHTML(value) {

  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]
  );
}

/* LOCAL DATE */

function localDateString(date) {

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");

}

/* DEFAULT TO YESTERDAY */

const yesterday = new Date();

yesterday.setDate(yesterday.getDate() - 1);

$("dateFilter").value = localDateString(yesterday);

/* CSV PARSER */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {

    const character = text[i];

    if (character === '"') {

      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }

    } else if (character === "," && !quoted) {

      row.push(cell);
      cell = "";

    } else if (
      (character === "\n" || character === "\r") &&
      !quoted
    ) {

      if (
        character === "\r" &&
        text[i + 1] === "\n"
      ) {
        i++;
      }

      row.push(cell);

      if (row.some(value => value.trim())) {
        rows.push(row);
      }

      row = [];
      cell = "";

    } else {

      cell += character;

    }
  }

  row.push(cell);

  if (row.some(value => value.trim())) {
    rows.push(row);
  }

  return rows;
}

/* OPPONENT TEAM */

function getOpponentTeam(matchup, team) {

  if (!matchup || !team) {
    return "";
  }

  const parts = matchup.split(
    /\s+(?:@|vs\.?|v\.?|at|-)\s+/i
  );

  if (parts.length !== 2) {
    return "";
  }

  const normalize = value =>
    value.trim().toUpperCase().replace(/\./g, "");

  if (normalize(parts[0]) === normalize(team)) {
    return parts[1].trim();
  }

  if (normalize(parts[1]) === normalize(team)) {
    return parts[0].trim();
  }

  return "";
}

/* VIDEO ID */

function getVideoId(row) {

  let id = String(
    row.video_id ||
    row.videoId ||
    row.brightcove_video_id ||
    ""
  ).trim();

  if (id) {
    return id;
  }

  for (const source of [
    row.player_url,
    row.clip_url
  ]) {

    if (!source) continue;

    try {

      id = new URL(
        source,
        location.href
      ).searchParams.get("videoId") || "";

    } catch (error) {

      const match = String(source).match(
        /[?&]videoId=(\d+)/i
      );

      id = match ? match[1] : "";
    }

    if (id) {
      return id;
    }
  }

  return "";
}

/* VIDEO URL */

function getClipUrl(row) {

  if (row.processed_clip_url) {
    return row.processed_clip_url.trim();
  }

  const id = getVideoId(row);

  return id
    ? "videos/" + encodeURIComponent(id) + ".mp4"
    : "";
}

/* CLIP KEY */

function clipKey(row) {

  return [
    row.game_date,
    row.team,
    row.pk_team,
    row.videoUrl
  ].join("|");

}

/* FORMAT DATE */

function formatDate(value) {

  const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(
    String(value || "")
  );

  if (!match) {
    return {
      main: value || "Unknown",
      year: ""
    };
  }

  const date = new Date(
    Date.UTC(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    )
  );

  return {
    main: date.toLocaleDateString("en-CA", {
      month: "short",
      day: "numeric",
      timeZone: "UTC"
    }),
    year: match[1]
  };
}

/* NHL TEAM LOGO HTML */

function teamHTML(team, isPP) {

  const name = escapeHTML(team || "—");
  const code = logoCode(team);

  return `
    <span class="team-pill
      ${isPP ? "pp" : ""}
      ${code ? "" : "logo-failed"}">

      ${code ? `
        <img
          class="team-logo"
          src="https://assets.nhle.com/logos/nhl/svg/${code}_light.svg"
          alt=""
          loading="lazy"
          referrerpolicy="no-referrer"
        >
      ` : ""}

      <span
        class="team-fallback"
        aria-hidden="true"
      >
        ${escapeHTML((team || "?").slice(0, 2))}
      </span>

      <span>${name}</span>

    </span>
  `;
}

/* APPLY FILTERS */

function applyFilters(reset = true) {

  if (reset) {
    currentPage = 0;
  }

  const query = $("search")
    .value.trim()
    .toUpperCase();

  const date = $("dateFilter").value;
  const type = $("teamFilter").value;

  filteredClips = allClips.filter(row => {

    if (
      currentView === "saved" &&
      !savedClips.has(clipKey(row))
    ) {
      return false;
    }

    if (
      date &&
      String(row.game_date || "").slice(0, 10) !== date
    ) {
      return false;
    }

    if (!query) {
      return true;
    }

    const pp = String(row.team || "").toUpperCase();
    const pk = String(row.pk_team || "").toUpperCase();

    if (type === "pp") {
      return pp.includes(query);
    }

    if (type === "pk") {
      return pk.includes(query);
    }

    return (
      pp.includes(query) ||
      pk.includes(query)
    );

  });

  filteredClips.sort((a, b) =>
    String(b.game_date || "").localeCompare(
      String(a.game_date || "")
    )
  );

  renderClips();
}

/* RENDER CLIPS */

function renderClips() {

  const start = currentPage * PAGE_SIZE;

  const rows = filteredClips.slice(
    start,
    start + PAGE_SIZE
  );

  $("resultCount").textContent =
    filteredClips.length +
    (filteredClips.length === 1
      ? " clip found"
      : " clips found");

  if (!rows.length) {

    $("clips").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>NO CLIPS AVAILABLE</strong>
            <p>
              No clips match the selected date or filters.
            </p>
          </div>
        </td>
      </tr>
    `;

  } else {

    $("clips").innerHTML = rows.map((row, i) => {

      const date = formatDate(row.game_date);
      const index = start + i;
      const saved = savedClips.has(clipKey(row));

      return `
        <tr>

          <td>
            <div class="date-main">
              ${escapeHTML(date.main)}
            </div>

            <div class="date-year">
              ${escapeHTML(date.year)}
            </div>
          </td>

          <td>
            ${teamHTML(row.team, true)}
          </td>

          <td>
            ${teamHTML(row.pk_team, false)}
          </td>

          <td>
            ${row.videoUrl ? `
              <button
                type="button"
                class="watch-button"
                data-play="${index}"
                aria-label="Watch clip"
              >
                ▶ WATCH
              </button>
            ` : "Unavailable"}
          </td>

          <td>
            <button
              type="button"
              class="save-button ${saved ? "saved" : ""}"
              data-save="${index}"
              aria-label="${saved
                ? "Remove saved clip"
                : "Save clip"}"
              aria-pressed="${saved}"
            >
              ${saved ? "★" : "☆"}
            </button>
          </td>

        </tr>
      `;

    }).join("");
  }

  $("pageInfo").textContent =
    filteredClips.length
      ? `Showing ${start + 1}–${
          Math.min(
            start + PAGE_SIZE,
            filteredClips.length
          )
        } of ${filteredClips.length}`
      : "No results";

  $("previousPage").disabled =
    currentPage === 0;

  $("nextPage").disabled =
    start + PAGE_SIZE >= filteredClips.length;
}

/* LOGO FALLBACK */

$("clips").addEventListener("error", event => {

  if (event.target.matches("img.team-logo")) {

    event.target.closest(".team-pill")
      ?.classList.add("logo-failed");

  }

}, true);

/* OPEN VIDEO */

function openVideo(url) {

  if (!url) return;

  lastFocus = document.activeElement;

  const player = $("clipPlayer");
  const modal = $("videoModal");
  const error = $("videoError");

  error.style.display = "none";
  error.textContent = "";

  player.pause();
  player.removeAttribute("src");
  player.load();

  player.onerror = () => {

    error.textContent =
      "This clip could not be loaded. " +
      "Check the MP4 file in the videos folder.";

    error.style.display = "block";
  };

  player.src = url;

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";

  $("closeVideo").focus();

  player.load();
  player.play().catch(() => {});
}

/* CLOSE VIDEO */

function closeVideo() {

  const modal = $("videoModal");

  if (!modal.classList.contains("open")) {
    return;
  }

  const player = $("clipPlayer");

  player.pause();
  player.removeAttribute("src");
  player.load();

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");

  document.body.style.overflow = "";

  if (lastFocus?.isConnected) {
    lastFocus.focus();
  }
}

/* SAVE CLIPS */

function toggleSaved(row) {

  const key = clipKey(row);

  if (savedClips.has(key)) {
    savedClips.delete(key);
  } else {
    savedClips.add(key);
  }

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify([...savedClips])
    );

  } catch (error) {
    // Storage may be unavailable.
  }

  applyFilters(false);
}

/* TABLE EVENTS */

$("clips").addEventListener("click", event => {

  const play = event.target.closest("[data-play]");

  if (play) {

    const row = filteredClips[
      Number(play.dataset.play)
    ];

    if (row) {
      openVideo(row.videoUrl);
    }

    return;
  }

  const save = event.target.closest("[data-save]");

  if (save) {

    const row = filteredClips[
      Number(save.dataset.save)
    ];

    if (row) {
      toggleSaved(row);
    }

  }

});

/* FILTER EVENTS */

for (const id of [
  "search",
  "dateFilter",
  "teamFilter"
]) {

  $(id).addEventListener(
    id === "search" ? "input" : "change",
    () => applyFilters()
  );

}

/* CLEAR FILTERS */

$("clearButton").addEventListener("click", () => {

  $("search").value = "";
  $("dateFilter").value = "";
  $("teamFilter").value = "both";

  applyFilters();
});

/* ALL / SAVED VIEW */

function setView(view) {

  currentView = view;

  $("allButton").classList.toggle(
    "active",
    view === "all"
  );

  $("savedButton").classList.toggle(
    "active",
    view === "saved"
  );

  $("allButton").setAttribute(
    "aria-pressed",
    String(view === "all")
  );

  $("savedButton").setAttribute(
    "aria-pressed",
    String(view === "saved")
  );

  applyFilters();
}

$("allButton").addEventListener(
  "click",
  () => setView("all")
);

$("savedButton").addEventListener(
  "click",
  () => setView("saved")
);

/* PAGINATION */

$("previousPage").addEventListener("click", () => {

  if (currentPage > 0) {
    currentPage--;
    renderClips();
  }

});

$("nextPage").addEventListener("click", () => {

  if (
    (currentPage + 1) * PAGE_SIZE <
    filteredClips.length
  ) {

    currentPage++;
    renderClips();

  }

});

/* VIDEO EVENTS */

$("closeVideo").addEventListener(
  "click",
  closeVideo
);

$("videoModal").addEventListener("click", event => {

  if (event.target === $("videoModal")) {
    closeVideo();
  }

});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeVideo();
  }

  if (
    event.key === "Tab" &&
    $("videoModal").classList.contains("open")
  ) {

    const focusable = [
      $("closeVideo"),
      $("clipPlayer")
    ];

    const index = focusable.indexOf(
      document.activeElement
    );

    if (event.shiftKey && index <= 0) {

      event.preventDefault();
      focusable[1].focus();

    } else if (!event.shiftKey && index === 1) {

      event.preventDefault();
      focusable[0].focus();

    }

  }

});

/* LOAD CSV */

async function loadClips() {

  try {

    const response = await fetch(
      "pp_goal_clips.csv?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("CSV unavailable");
    }

    const records = parseCSV(
      (await response.text()).replace(/^\uFEFF/, "")
    );

    if (records.length < 2) {

      allClips = [];
      applyFilters();
      return;
    }

    const headers = records.shift().map(
      value => value.trim()
    );

    allClips = records.map(values => {

      const row = Object.fromEntries(
        headers.map((header, i) => [
          header,
          (values[i] || "").trim()
        ])
      );

      row.pk_team =
        row.pk_team ||
        getOpponentTeam(row.matchup, row.team);

      row.videoUrl = getClipUrl(row);

      return row;
    });

    applyFilters();

  } catch (error) {

    $("resultCount").textContent =
      "Unable to load clips";

    $("clips").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>COULD NOT LOAD CLIPS</strong>
            <p>
              Check that pp_goal_clips.csv
              is beside index.html.
            </p>
          </div>
        </td>
      </tr>
    `;

    $("pageInfo").textContent = "Unavailable";

    $("previousPage").disabled = true;
    $("nextPage").disabled = true;

  }
}

/* START */

loadClips();

</script>

</html>
