
<!DOCTYPE html>

<script>
"use strict";

const $ = id => document.getElementById(id);

let allClips = [];
let filteredClips = [];
let currentPage = 0;
let currentView = "all";
let lastFocus = null;

const PAGE_SIZE = 20;
const STORAGE_KEY = "ridgebacks-saved-clips-v1";

let savedClips = new Set();

try {
  const stored = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if (Array.isArray(stored)) {
    savedClips = new Set(
      stored.filter(value => typeof value === "string")
    );
  }
} catch (error) {
  savedClips = new Set();
}

/* SAFE HTML */

function escapeHTML(value) {
  return String(value ?? "").replace(
    /[&<>"']/g,
    character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]
  );
}

/* CSV PARSER */

function parseCSV(text) {

  const rows = [];

  let row = [];
  let cell = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {

    const character = text[i];

    if (character === '"') {

      if (quoted && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }

    } else if (character === "," && !quoted) {

      row.push(cell);
      cell = "";

    } else if (
      (character === "\n" || character === "\r") &&
      !quoted
    ) {

      if (
        character === "\r" &&
        text[i + 1] === "\n"
      ) {
        i++;
      }

      row.push(cell);

      if (row.some(value => value.trim())) {
        rows.push(row);
      }

      row = [];
      cell = "";

    } else {

      cell += character;

    }
  }

  row.push(cell);

  if (row.some(value => value.trim())) {
    rows.push(row);
  }

  return rows;
}

/* OPPOSING TEAM */

function getOpponentTeam(matchup, scoringTeam) {

  if (!matchup || !scoringTeam) {
    return "";
  }

  const teams = matchup.split(
    /\s+(?:@|vs\.?|v\.?|at|-)\s+/i
  );

  if (teams.length !== 2) {
    return "";
  }

  const normalize = value =>
    value.trim().toUpperCase().replace(/\./g, "");

  if (normalize(teams[0]) === normalize(scoringTeam)) {
    return teams[1].trim();
  }

  if (normalize(teams[1]) === normalize(scoringTeam)) {
    return teams[0].trim();
  }

  return "";
}

/* VIDEO ID */

function getVideoId(row) {

  let id = String(
    row.video_id ||
    row.videoId ||
    row.brightcove_video_id ||
    ""
  ).trim();

  if (id) {
    return id;
  }

  for (const source of [
    row.player_url,
    row.clip_url
  ]) {

    if (!source) {
      continue;
    }

    try {

      id = new URL(
        source,
        location.href
      ).searchParams.get("videoId") || "";

    } catch (error) {

      const match = String(source).match(
        /[?&]videoId=(\d+)/i
      );

      id = match ? match[1] : "";

    }

    if (id) {
      return id;
    }
  }

  return "";
}

/* VIDEO FILE LOCATION */

function getClipUrl(row) {

  if (row.processed_clip_url) {
    return row.processed_clip_url.trim();
  }

  const id = getVideoId(row);

  if (!id) {
    return "";
  }

  return "videos/" +
    encodeURIComponent(id) +
    ".mp4";
}

/* UNIQUE CLIP KEY */

function clipKey(row) {

  return [
    row.game_date,
    row.team,
    row.pk_team,
    row.videoUrl
  ].join("|");

}

/* DATE FORMATTING */

function formatDate(value) {

  const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(
    String(value || "")
  );

  if (!match) {
    return {
      main: value || "Unknown",
      year: ""
    };
  }

  const date = new Date(
    Date.UTC(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    )
  );

  return {
    main: date.toLocaleDateString("en-CA", {
      month: "short",
      day: "numeric",
      timeZone: "UTC"
    }),
    year: match[1]
  };
}

/* NOTIFICATION */

function showToast(message) {

  const toast = $("toast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2200);

}

/* UPDATE TOTAL */

function updateTotal() {

  $("totalClips").textContent =
    allClips.length.toLocaleString("en-CA");

}

/* FILTER CLIPS */

function applyFilters(resetPage = true) {

  if (resetPage) {
    currentPage = 0;
  }

  const query = $("search")
    .value.trim()
    .toUpperCase();

  const role = $("teamFilter").value;

  filteredClips = allClips.filter(row => {

    if (
      currentView === "saved" &&
      !savedClips.has(clipKey(row))
    ) {
      return false;
    }

    const pp = (row.team || "").toUpperCase();
    const pk = (row.pk_team || "").toUpperCase();

    if (!query) {
      return true;
    }

    if (role === "pp") {
      return pp.includes(query);
    }

    if (role === "pk") {
      return pk.includes(query);
    }

    return (
      pp.includes(query) ||
      pk.includes(query) ||
      (row.matchup || "")
        .toUpperCase().includes(query) ||
      (row.game_date || "")
        .toUpperCase().includes(query)
    );

  });

  /* NEWEST CLIPS FIRST - NO SORT DROPDOWN */

  filteredClips.sort((a, b) =>
    (b.game_date || "").localeCompare(
      a.game_date || ""
    )
  );

  if (currentView === "recent") {
    filteredClips = filteredClips.slice(0, 30);
  }

  renderClips();
}

/* RENDER TABLE */

function renderClips() {

  const start = currentPage * PAGE_SIZE;

  const rows = filteredClips.slice(
    start,
    start + PAGE_SIZE
  );

  $("resultCount").textContent =
    filteredClips.length.toLocaleString("en-CA") +
    " clips found";

  if (rows.length === 0) {

    $("clips").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>No clips found</strong>
            Try a different team, date, or filter.
          </div>
        </td>
      </tr>
    `;

  } else {

    $("clips").innerHTML = rows.map((row, index) => {

      const date = formatDate(row.game_date);
      const key = clipKey(row);
      const isSaved = savedClips.has(key);
      const rowIndex = start + index;

      const videoButton = row.videoUrl
        ? `
          <button
            class="watch-button"
            type="button"
            data-play="${rowIndex}"
            aria-label="Watch clip"
          >
            ▶ WATCH
          </button>
        `
        : `<span>Unavailable</span>`;

      return `
        <tr>

          <td>
            <div class="date-main">
              ${escapeHTML(date.main)}
            </div>
            <div class="date-year">
              ${escapeHTML(date.year)}
            </div>
          </td>

          <td>
            <span class="team pp">
              ${escapeHTML(row.team || "—")}
            </span>
          </td>

          <td>
            <span class="team">
              ${escapeHTML(row.pk_team || "—")}
            </span>
          </td>

          <td>
            ${videoButton}
          </td>

          <td>
            <button
              class="save-button ${isSaved ? "saved" : ""}"
              type="button"
              data-save="${rowIndex}"
              aria-label="${isSaved
                ? "Remove saved clip"
                : "Save clip"}"
              aria-pressed="${isSaved}"
            >
              ${isSaved ? "★" : "☆"}
            </button>
          </td>

        </tr>
      `;

    }).join("");

  }

  $("pageInfo").textContent =
    filteredClips.length
      ? `Showing ${start + 1}–${
          Math.min(
            start + PAGE_SIZE,
            filteredClips.length
          )
        } of ${filteredClips.length}`
      : "No results";

  $("previousPage").disabled =
    currentPage === 0;

  $("nextPage").disabled =
    start + PAGE_SIZE >= filteredClips.length;

  updateTotal();
}

/* OPEN VIDEO */

function openVideo(url) {

  if (!url) {
    return;
  }

  lastFocus = document.activeElement;

  const modal = $("videoModal");
  const player = $("clipPlayer");
  const error = $("videoError");

  error.style.display = "none";
  error.textContent = "";

  player.pause();
  player.removeAttribute("src");
  player.load();

  player.onerror = function() {

    error.textContent =
      "This clip could not be loaded. " +
      "Check that the MP4 exists in the videos folder.";

    error.style.display = "block";

  };

  player.src = url;

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";

  $("closeVideo").focus();

  player.load();

  player.play().catch(() => {
    // Browser may require manual playback.
  });
}

/* CLOSE VIDEO */

function closeVideo() {

  const modal = $("videoModal");

  if (!modal.classList.contains("open")) {
    return;
  }

  const player = $("clipPlayer");

  player.pause();
  player.removeAttribute("src");
  player.load();

  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");

  document.body.style.overflow = "";

  if (lastFocus && lastFocus.isConnected) {
    lastFocus.focus();
  }
}

/* SAVE CLIPS */

function toggleSaved(row) {

  const key = clipKey(row);

  if (savedClips.has(key)) {

    savedClips.delete(key);
    showToast("Removed from saved clips");

  } else {

    savedClips.add(key);
    showToast("Clip saved");

  }

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify([...savedClips])
    );

  } catch (error) {

    showToast("Browser storage unavailable");

  }

  applyFilters(false);
}

/* TABLE EVENTS */

$("clips").addEventListener("click", event => {

  const playButton = event.target.closest(
    "[data-play]"
  );

  if (playButton) {

    const row = filteredClips[
      Number(playButton.dataset.play)
    ];

    if (row) {
      openVideo(row.videoUrl);
    }

    return;
  }

  const saveButton = event.target.closest(
    "[data-save]"
  );

  if (saveButton) {

    const row = filteredClips[
      Number(saveButton.dataset.save)
    ];

    if (row) {
      toggleSaved(row);
    }

  }

});

/* SEARCH EVENTS */

$("search").addEventListener(
  "input",
  () => applyFilters()
);

$("teamFilter").addEventListener(
  "change",
  () => applyFilters()
);

/* CLEAR SEARCH */

$("clearButton").addEventListener("click", () => {

  $("search").value = "";
  $("teamFilter").value = "both";

  currentView = "all";

  document.querySelectorAll("[data-view]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.view === "all"
      );

    });

  applyFilters();
});

/* VIEW BUTTONS */

document.querySelectorAll("[data-view]")
  .forEach(button => {

    button.addEventListener("click", () => {

      currentView = button.dataset.view;

      document.querySelectorAll("[data-view]")
        .forEach(item => {

          item.classList.toggle(
            "active",
            item === button
          );

        });

      applyFilters();

    });

  });

/* PAGINATION */

$("previousPage").addEventListener("click", () => {

  if (currentPage > 0) {
    currentPage--;
    renderClips();
  }

});

$("nextPage").addEventListener("click", () => {

  if (
    (currentPage + 1) * PAGE_SIZE <
    filteredClips.length
  ) {

    currentPage++;
    renderClips();

  }

});

/* RANDOM CLIP */

$("randomButton").addEventListener("click", () => {

  const available = filteredClips.filter(
    row => row.videoUrl
  );

  if (!available.length) {

    showToast("No playable clips in this view");
    return;

  }

  const randomIndex = Math.floor(
    Math.random() * available.length
  );

  openVideo(available[randomIndex].videoUrl);

});

/* VIDEO EVENTS */

$("closeVideo").addEventListener(
  "click",
  closeVideo
);

$("videoModal").addEventListener("click", event => {

  if (event.target === $("videoModal")) {
    closeVideo();
  }

});

document.addEventListener("keydown", event => {

  if (event.key === "Escape") {
    closeVideo();
  }

  if (
    event.key === "Tab" &&
    $("videoModal").classList.contains("open")
  ) {

    const focusable = [
      $("closeVideo"),
      $("clipPlayer")
    ];

    const index = focusable.indexOf(
      document.activeElement
    );

    if (event.shiftKey && index <= 0) {

      event.preventDefault();
      focusable[focusable.length - 1].focus();

    } else if (
      !event.shiftKey &&
      index === focusable.length - 1
    ) {

      event.preventDefault();
      focusable[0].focus();

    }

  }

});

/* LOAD CLIPS FROM CSV */

async function loadClips() {

  try {

    const response = await fetch(
      "pp_goal_clips.csv?t=" + Date.now()
    );

    if (!response.ok) {

      throw new Error(
        "CSV could not be loaded (HTTP " +
        response.status +
        ")"
      );

    }

    const csvText = (
      await response.text()
    ).replace(/^\uFEFF/, "");

    const records = parseCSV(csvText);

    if (records.length < 2) {

      allClips = [];
      applyFilters();
      return;

    }

    const headers = records.shift().map(
      value => value.trim()
    );

    allClips = records.map(values => {

      const row = Object.fromEntries(
        headers.map((header, index) => [
          header,
          (values[index] || "").trim()
        ])
      );

      row.pk_team = getOpponentTeam(
        row.matchup,
        row.team
      );

      row.videoUrl = getClipUrl(row);

      return row;

    });

    applyFilters();

  } catch (error) {

    allClips = [];
    updateTotal();

    $("resultCount").textContent =
      "Clips unavailable";

    $("clips").innerHTML = `
      <tr>
        <td colspan="5">
          <div class="empty">
            <strong>
              Could not load the clip library
            </strong>
            ${escapeHTML(error.message)}
            <p>
              Make sure pp_goal_clips.csv is
              beside index.html.
            </p>
          </div>
        </td>
      </tr>
    `;

    $("pageInfo").textContent =
      "Unable to load clips";

    $("previousPage").disabled = true;
    $("nextPage").disabled = true;

  }
}

/* INITIALIZE */

loadClips();

</script>

</html>
