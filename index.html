<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NHL Power Play Clips | Ridgebacks</title>

<style>
:root {
  --navy:#153e70;
  --orange:#df6436;
  --bg:#f5f7fa;
  --line:#dce5ef;
  --muted:#66798d;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:#21354a;
  font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
}

button,input,select { font:inherit; }
button { cursor:pointer; }
button:disabled { opacity:.4;cursor:not-allowed; }

button:focus-visible,
input:focus-visible,
select:focus-visible,
a:focus-visible {
  outline:3px solid #ec986e;
  outline-offset:2px;
}

.wrap {
  width:min(1080px,calc(100% - 24px));
  margin:auto;
}

/* HEADER */

header {
  background:#fff;
  border-bottom:3px solid var(--orange);
}

.mast {
  display:flex;
  align-items:center;
  gap:12px;
  min-height:80px;
  padding:8px 0;
}

.ridge {
  width:60px;
  height:60px;
  object-fit:contain;
}

.brand {
  font-size:20px;
  font-weight:900;
  color:var(--navy);
  letter-spacing:.05em;
  line-height:1.2;
}

.subtitle {
  display:block;
  margin-top:4px;
  font-size:11px;
  color:#82909f;
  font-weight:600;
  letter-spacing:0;
}

/* TITLE */

.hero {
  display:flex;
  align-items:center;
  gap:13px;
  padding:24px 0 19px;
}

.nhl {
  width:58px;
  height:58px;
  object-fit:contain;
}

.hero h1 {
  font-size:clamp(24px,5vw,34px);
  margin:0;
  color:var(--navy);
  letter-spacing:-.03em;
}

/* VIDEO LIBRARY */

.panel {
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  margin-bottom:35px;
  box-shadow:0 4px 18px #1c416010;
}

.panel h2 {
  font-size:20px;
  margin:0;
  padding:19px 19px 12px;
  color:var(--navy);
}

.filters {
  display:grid;
  grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) auto;
  gap:10px;
  padding:0 19px 18px;
  align-items:end;
}

.field { min-width:0; }

.field label {
  display:block;
  font-size:10px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:5px;
  letter-spacing:.04em;
}

.field input,
.field select {
  width:100%;
  min-width:0;
  height:43px;
  border:1px solid #ccd8e5;
  border-radius:8px;
  padding:0 10px;
  background:white;
  color:#21354a;
}

.clear {
  height:43px;
  border:1px solid var(--line);
  border-radius:8px;
  padding:0 14px;
  background:#f7f9fb;
  color:var(--navy);
  font-weight:800;
}

.toolbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  background:#f8fafc;
  border-block:1px solid var(--line);
  padding:10px 19px;
}

.tabs {
  display:flex;
  gap:7px;
}

.tab {
  padding:9px 13px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--navy);
  font-weight:750;
}

.tab.active {
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}

.count {
  font-size:12px;
  color:var(--muted);
}

/* CLIP CARDS */

.clip-list {
  padding:10px;
  display:grid;
  gap:9px;
}

.clip {
  border:1px solid var(--line);
  border-radius:10px;
  padding:12px;
  display:grid;
  grid-template-columns:100px minmax(0,1fr) auto auto;
  align-items:center;
  gap:12px;
}

.date strong {
  display:block;
  color:var(--navy);
}

.date small { color:var(--muted); }

.match {
  display:flex;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
}

.team {
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:38px;
  background:#f3f7fa;
  border:1px solid var(--line);
  border-radius:8px;
  padding:4px 8px 4px 4px;
  color:var(--navy);
  font-weight:800;
}

.team img {
  width:29px;
  height:29px;
  object-fit:contain;
}

.vs {
  font-size:10px;
  color:var(--muted);
  font-weight:800;
}

.scorer {
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
}

.watch {
  border:0;
  border-radius:8px;
  background:var(--orange);
  color:white;
  font-weight:800;
  font-size:11px;
  padding:11px 13px;
}

.save {
  border:1px solid var(--line);
  border-radius:8px;
  background:white;
  color:#8293a5;
  width:38px;
  height:38px;
  font-size:23px;
}

.save.on { color:var(--orange); }

.empty {
  text-align:center;
  padding:42px 12px;
  color:var(--muted);
}

.empty strong {
  display:block;
  font-size:16px;
  color:var(--navy);
}

.pages {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:15px;
  border-top:1px solid var(--line);
}

.pages button {
  border:1px solid var(--line);
  background:white;
  border-radius:7px;
  padding:8px 12px;
}

.pages span {
  font-size:12px;
  color:var(--muted);
}

/* FOOTER */

footer {
  background:white;
  border-top:1px solid var(--line);
  text-align:center;
  padding:25px 12px;
  color:var(--navy);
  font-size:11px;
  font-weight:800;
}

footer .credits {
  margin-top:8px;
  font-weight:500;
  color:var(--muted);
}

footer a { color:var(--navy); }

/* CLEAN VIDEO PLAYER */

.modal {
  position:fixed;
  inset:0;
  background:#031222ed;
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:10px;
}

.modal.open { display:flex; }

.video-box {
  width:min(100%,1000px);
  position:relative;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

.video-box video {
  display:block;
  width:100%;
  max-height:80dvh;
}

/* CLEAN X BUTTON */

.close {
  position:absolute;
  top:9px;
  right:9px;
  z-index:2;
  border:1px solid #ffffff88;
  border-radius:50%;
  width:38px;
  height:38px;
  background:#000c;
  color:#fff;
  font-size:26px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:background .2s;
}

.close:hover { background:#df6436; }

.video-fallback {
  display:none;
  padding:17px;
  background:#fff;
  color:#273b50;
  text-align:center;
}

.video-fallback a {
  display:inline-block;
  margin-top:8px;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  border-radius:7px;
  padding:10px 14px;
  font-weight:800;
}

.video-fallback p { margin:5px 0; }

/* MOBILE */

@media(max-width:760px) {
  .filters {
    grid-template-columns:1fr 1fr;
  }

  .filters .search,
  .filters .clear {
    grid-column:1/-1;
  }
}

@media(max-width:600px) {
  .mast { min-height:66px;gap:9px; }
  .ridge { width:49px;height:49px; }
  .brand { font-size:16px; }
  .subtitle { font-size:10px; }

  .hero {
    padding:18px 0 15px;
    gap:10px;
  }

  .nhl { width:43px;height:43px; }

  .hero h1 {
    font-size:clamp(21px,6vw,29px);
  }

  .panel h2 {
    padding:15px 12px 11px;
    font-size:18px;
  }

  .filters { padding:0 12px 13px;gap:8px; }
  .toolbar { padding:10px 12px; }
  .clip-list { padding:8px; }

  .clip {
    grid-template-columns:minmax(0,1fr) auto;
    gap:9px;
    padding:11px;
  }

  .date {
    grid-column:1/-1;
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }

  .date strong {
    display:inline;
    font-size:12px;
  }

  .date small {
    margin-left:8px;
    font-size:11px;
  }

  .match-cell { grid-column:1; }

  .clip .watch {
    grid-column:2;
    grid-row:2;
  }

  .clip .save {
    grid-column:2;
    grid-row:1;
    justify-self:end;
    width:30px;
    height:30px;
    font-size:20px;
  }

  .team {
    font-size:11px;
    gap:4px;
    padding:3px 5px 3px 3px;
  }

  .team img { width:25px;height:25px; }
  .watch { padding:10px 8px; }
  .count { font-size:11px; }
  .pages { gap:8px; }
  .pages button { padding:8px 9px; }
}

@media(max-width:350px) {
  .brand { font-size:14px; }
  .subtitle { font-size:9px; }
  .team { font-size:10px; }
  .team img { width:22px;height:22px; }
}
</style>
</head>

<body>

<header>
  <div class="wrap mast">

    <img
      class="ridge"
      src="ridgebacks-logo.png"
      alt="Ontario Tech Ridgebacks"
    >

    <div class="brand">
      RIDGEBACKS
      <span class="subtitle">
        NHL Power Play Goal Database
      </span>
    </div>

  </div>
</header>

<main class="wrap">

  <div class="hero">

    <img
      class="nhl"
      src="https://assets.nhle.com/logos/nhl/svg/NHL_light.svg"
      alt="NHL logo"
    >

    <h1>Power Play Clips</h1>

  </div>

  <section class="panel">

    <h2>Video Library</h2>

    <div class="filters">

      <div class="field search">
        <label for="search">
          SEARCH TEAM OR PLAYER
        </label>
        <input
          id="search"
          type="search"
          placeholder="TOR, Boston, Nylander"
        >
      </div>

      <div class="field">
        <label for="date">GAME DATE</label>
        <input id="date" type="date">
      </div>

      <div class="field">
        <label for="role">TEAM TYPE</label>
        <select id="role">
          <option value="both">PP or PK</option>
          <option value="pp">PP Team</option>
          <option value="pk">PK Team</option>
        </select>
      </div>

      <button id="clear" class="clear">
        Clear Filters
      </button>

    </div>

    <div class="toolbar">

      <div class="tabs">
        <button id="all" class="tab active">
          All Clips
        </button>
        <button id="saved" class="tab">
          Saved
        </button>
      </div>

      <span class="count" id="count">
        Loading...
      </span>

    </div>

    <div id="list" class="clip-list">
      <div class="empty">Loading clips...</div>
    </div>

    <div class="pages">
      <button id="prev">Previous</button>
      <span id="pageInfo"></span>
      <button id="next">Next</button>
    </div>

  </section>

</main>

<footer>
  NHL POWER PLAY VIDEO DATABASE

  <div class="credits">
    Contributors:
    <a href="https://github.com/turkjr19">
      Turkjr19
    </a>
    ·
    <a href="https://github.com/NoahCornish">
      NoahCornish
    </a>
  </div>
</footer>

<!-- VIDEO MODAL -->

<div
  id="modal"
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-label="Video player"
  aria-hidden="true"
>
  <div class="video-box">

    <button
      id="close"
      class="close"
      aria-label="Close video"
      title="Close video"
    >
      &times;
    </button>

    <video
      id="video"
      controls
      playsinline
      preload="metadata"
    ></video>

    <div id="fallback" class="video-fallback">
      <p>This clip isn't available as a local MP4.</p>

      <a
        id="original"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      >
        Watch on NHL.com
      </a>
    </div>

  </div>
</div>

<script>
'use strict';

/* BASIC HELPERS */

const $ = id => document.getElementById(id);

const names = {
  ANA:'Anaheim Ducks',
  BOS:'Boston Bruins',
  BUF:'Buffalo Sabres',
  CAR:'Carolina Hurricanes',
  CBJ:'Columbus Blue Jackets',
  CGY:'Calgary Flames',
  CHI:'Chicago Blackhawks',
  COL:'Colorado Avalanche',
  DAL:'Dallas Stars',
  DET:'Detroit Red Wings',
  EDM:'Edmonton Oilers',
  FLA:'Florida Panthers',
  LAK:'Los Angeles Kings',
  MIN:'Minnesota Wild',
  MTL:'Montreal Canadiens',
  NJD:'New Jersey Devils',
  NSH:'Nashville Predators',
  NYI:'New York Islanders',
  NYR:'New York Rangers',
  OTT:'Ottawa Senators',
  PHI:'Philadelphia Flyers',
  PIT:'Pittsburgh Penguins',
  SEA:'Seattle Kraken',
  SJS:'San Jose Sharks',
  STL:'St. Louis Blues',
  TBL:'Tampa Bay Lightning',
  TOR:'Toronto Maple Leafs',
  UTA:'Utah Mammoth',
  VAN:'Vancouver Canucks',
  VGK:'Vegas Golden Knights',
  WSH:'Washington Capitals',
  WPG:'Winnipeg Jets'
};

const aliases = {
  LA:'LAK',
  SJ:'SJS',
  TB:'TBL',
  NJ:'NJD',
  WAS:'WSH',
  MON:'MTL',
  ARI:'UTA'
};

const norm = x => {
  const s = String(x||'').trim().toUpperCase();
  return aliases[s]||s;
};

const esc = s =>
  String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));

const logo = t =>
  `https://assets.nhle.com/logos/nhl/svg/${
    encodeURIComponent(norm(t))
  }_light.svg`;

const PAGE_SIZE = 20;
const STORE = 'ridgebacks-saved-clips-v1';

let clips = [];
let filtered = [];
let page = 0;
let selected = '';
let view = 'all';
let saved = new Set();
let lastFocus = null;

try {
  saved = new Set(
    JSON.parse(localStorage.getItem(STORE)||'[]')
  );
} catch(e) {}

/* CSV PARSER */

function parseCSV(s) {
  const rows = [];
  let row = [];
  let cell = '';
  let quoted = false;

  for(let i=0;i<s.length;i++) {
    const c = s[i];

    if(c==='"') {
      if(quoted && s[i+1]==='"') {
        cell += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if(c===',' && !quoted) {
      row.push(cell);
      cell = '';
    } else if(
      (c==='\n' || c==='\r') && !quoted
    ) {
      if(c==='\r' && s[i+1]==='\n') i++;

      row.push(cell);

      if(row.some(x=>x.trim())) rows.push(row);

      row = [];
      cell = '';
    } else {
      cell += c;
    }
  }

  row.push(cell);

  if(row.some(x=>x.trim())) rows.push(row);

  return rows;
}

/* GET OPPONENT */

function opponent(r) {
  const parts = String(r.matchup||'')
    .split(/\s*(?:@|\bvs\.?\b|\bat\b)\s*/i)
    .map(norm);

  if(parts.length!==2) return '';

  return parts[0]===r.team
    ? parts[1]
    : parts[1]===r.team
      ? parts[0]
      : '';
}

/* GET VIDEO ID */

function videoId(r) {
  const direct = String(r.video_id||'').trim();

  if(direct) return direct;

  for(const url of [r.player_url,r.clip_url]) {
    const m = String(url||'').match(
      /(?:videoId=|[-/])(\d{10,})(?:\D|$)/i
    );

    if(m) return m[1];
  }

  return '';
}

/* CLIP HELPERS */

const key = r => [
  r.game_date,
  r.game_id,
  r.team,
  r.scorer,
  r.videoId
].join('|');

function dateLabel(s) {
  const m = String(s||'').match(
    /^(\d{4})-(\d{2})-(\d{2})/
  );

  return m
    ? new Date(
        Date.UTC(+m[1],+m[2]-1,+m[3])
      ).toLocaleDateString('en-CA',{
        month:'short',
        day:'numeric',
        year:'numeric',
        timeZone:'UTC'
      })
    : s;
}

/* TEAM LOGO BUTTONS */

function teamButton(t) {
  return `
    <button
      class="team"
      data-team="${esc(t)}"
      aria-label="Show all clips for ${esc(names[t]||t)}"
    >
      <img
        src="${logo(t)}"
        alt=""
        loading="lazy"
        onerror="this.style.display='none'"
      >
      <span>${esc(t||'—')}</span>
    </button>
  `;
}

/* FILTER CLIPS */

function filterClips() {
  page = 0;

  const q = $('search').value.trim().toLowerCase();
  const date = $('date').value;
  const role = $('role').value;

  filtered = clips.filter(r=>{
    if(
      view==='saved' &&
      !saved.has(key(r))
    ) return false;

    if(date && r.game_date!==date) return false;

    if(selected) {
      if(role==='pp' && r.team!==selected) return false;
      if(role==='pk' && r.pk_team!==selected) return false;

      if(
        role==='both' &&
        r.team!==selected &&
        r.pk_team!==selected
      ) return false;
    }

    const fields = role==='pp'
      ? [r.team,names[r.team],r.scorer]
      : role==='pk'
        ? [r.pk_team,names[r.pk_team]]
        : [
            r.team,
            r.pk_team,
            names[r.team],
            names[r.pk_team],
            r.scorer
          ];

    return fields.some(s=>
      String(s||'').toLowerCase().includes(q)
    );
  }).sort((a,b)=>
    b.game_date.localeCompare(a.game_date)
  );

  $('all').classList.toggle(
    'active',view==='all'
  );

  $('saved').classList.toggle(
    'active',view==='saved'
  );

  render();
}

/* RENDER CLIP CARDS */

function render() {
  const rows = filtered.slice(
    page*PAGE_SIZE,
    (page+1)*PAGE_SIZE
  );

  $('count').textContent =
    filtered.length+' clips';

  $('list').innerHTML = rows.length
    ? rows.map((r,i)=>`
      <article class="clip">

        <div class="date">
          <strong>${esc(dateLabel(r.game_date))}</strong>
          <small>
            ${esc(r.period||'')}
            ${esc(r.time_in_period||'')}
          </small>
        </div>

        <div class="match-cell">

          <div class="match">
            ${teamButton(r.team)}
            <span class="vs">VS</span>
            ${teamButton(r.pk_team)}
          </div>

          <div class="scorer">
            ${esc(r.scorer||'Power-play goal')}
          </div>

        </div>

        <button
          class="watch"
          data-watch="${page*PAGE_SIZE+i}"
          ${!r.videoUrl&&!r.clip_url?'disabled':''}
        >
          ▶ WATCH
        </button>

        <button
          class="save ${saved.has(key(r))?'on':''}"
          data-save="${page*PAGE_SIZE+i}"
          aria-label="Save clip"
        >
          ${saved.has(key(r))?'★':'☆'}
        </button>

      </article>
    `).join('')
    : `
      <div class="empty">
        <strong>NO CLIPS AVAILABLE</strong>
        Try a different date or team.
      </div>
    `;

  $('pageInfo').textContent = filtered.length
    ? `${
        page*PAGE_SIZE+1
      }–${
        Math.min(
          (page+1)*PAGE_SIZE,
          filtered.length
        )
      } of ${filtered.length}`
    : 'No results';

  $('prev').disabled = page===0;

  $('next').disabled =
    (page+1)*PAGE_SIZE>=filtered.length;
}

/* CLICK TEAM TO SEE ALL ITS CLIPS */

function selectTeam(t) {
  selected = norm(t);

  $('search').value = '';
  $('date').value = '';
  $('role').value = 'both';

  view = 'all';

  filterClips();
}

/* LIBRARY EVENTS */

$('list').addEventListener('click',e=>{
  const t = e.target.closest('[data-team]');

  if(t) {
    selectTeam(t.dataset.team);
    return;
  }

  const w = e.target.closest('[data-watch]');

  if(w) {
    openVideo(filtered[+w.dataset.watch]);
    return;
  }

  const s = e.target.closest('[data-save]');

  if(s) {
    const r = filtered[+s.dataset.save];
    const k = key(r);

    saved.has(k)
      ? saved.delete(k)
      : saved.add(k);

    try {
      localStorage.setItem(
        STORE,
        JSON.stringify([...saved])
      );
    } catch(e) {}

    render();
  }
});

$('search').addEventListener('input',()=>{
  selected='';
  filterClips();
});

$('date').addEventListener('change',()=>{
  selected='';
  filterClips();
});

$('role').addEventListener(
  'change',filterClips
);

$('clear').onclick=()=>{
  selected='';
  view='all';

  $('search').value='';
  $('date').value='';
  $('role').value='both';

  filterClips();
};

$('all').onclick=()=>{
  view='all';
  filterClips();
};

$('saved').onclick=()=>{
  view='saved';
  filterClips();
};

$('prev').onclick=()=>{
  if(page) {
    page--;
    render();
  }
};

$('next').onclick=()=>{
  if((page+1)*PAGE_SIZE<filtered.length) {
    page++;
    render();
  }
};

/* VIDEO PLAYER */

function openVideo(r) {
  if(!r) return;

  lastFocus = document.activeElement;

  const v = $('video');
  const fallback = $('fallback');
  const link = $('original');

  v.pause();
  v.removeAttribute('src');
  v.load();

  fallback.style.display='none';
  v.style.display='block';

  const original =
    /^https:\/\/(?:www\.)?(?:nhl\.com|players\.brightcove\.net)\//i
      .test(r.clip_url||'')
      ? r.clip_url
      : '';

  link.href=original||'#';
  link.style.display=original
    ? 'inline-block'
    : 'none';

  function showFallback() {
    v.pause();
    v.style.display='none';
    fallback.style.display='block';

    if(!original) {
      fallback.querySelector('p').textContent =
        'This video is unavailable.';
    }
  }

  v.onerror=showFallback;

  if(r.videoUrl) {
    v.src=r.videoUrl;
    v.load();
  } else {
    showFallback();
  }

  $('modal').classList.add('open');
  $('modal').setAttribute(
    'aria-hidden','false'
  );

  document.body.style.overflow='hidden';

  $('close').focus();

  if(r.videoUrl) {
    v.play().catch(()=>{});
  }
}

/* CLOSE VIDEO AND STOP PLAYBACK */

function closeVideo() {
  if(
    !$('modal').classList.contains('open')
  ) return;

  const v = $('video');

  v.pause();
  v.removeAttribute('src');
  v.load();

  $('modal').classList.remove('open');
  $('modal').setAttribute(
    'aria-hidden','true'
  );

  document.body.style.overflow='';

  if(lastFocus?.isConnected) {
    lastFocus.focus();
  }
}

/* X BUTTON */

$('close').onclick=closeVideo;

/* CLICK OUTSIDE VIDEO */

$('modal').onclick=e=>{
  if(e.target===$('modal')) {
    closeVideo();
  }
};

/* ESCAPE KEY */

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') {
    closeVideo();
  }
});

/* LOAD CSV */

async function load() {
  try {
    const response=await fetch(
      'pp_goal_clips.csv?t='+Date.now(),
      {cache:'no-store'}
    );

    if(!response.ok) {
      throw Error('CSV unavailable');
    }

    const records=parseCSV(
      (await response.text()).replace(
        /^\uFEFF/,''
      )
    );

    const headers=(records.shift()||[])
      .map(x=>x.trim());

    clips=records.map(values=>{
      const r=Object.fromEntries(
        headers.map((h,i)=>[
          h,
          String(values[i]||'').trim()
        ])
      );

      r.team=norm(r.team);

      r.pk_team=norm(
        r.pk_team||opponent(r)
      );

      r.videoId=videoId(r);

      r.videoUrl=
        r.processed_clip_url ||
        (
          r.videoId
            ? `videos/${
                encodeURIComponent(r.videoId)
              }.mp4`
            : ''
        );

      return r;
    }).filter(r=>r.team&&r.game_date);

    filterClips();

  } catch(e) {
    console.error(e);

    $('count').textContent='Unavailable';

    $('list').innerHTML=`
      <div class="empty">
        <strong>COULD NOT LOAD CLIPS</strong>
        Check pp_goal_clips.csv in the repository.
      </div>
    `;
  }
}

/* DEFAULT TO YESTERDAY */

const d=new Date();
d.setDate(d.getDate()-1);

$('date').value=[
  d.getFullYear(),
  String(d.getMonth()+1).padStart(2,'0'),
  String(d.getDate()).padStart(2,'0')
].join('-');

/* INITIALIZE */

load();
