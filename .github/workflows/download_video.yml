
name: Download and Process Hockey Videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install yt-dlp
        run: |
          sudo curl -L \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Download and process CSV videos
        run: |
          Rscript video_processing.R

      - name: Commit processed videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add videos/

          if git diff --cached --quiet; then
            echo "No new videos to commit"
          else
            git commit -m "Update processed hockey videos"
            git push
          fi

      - name: Upload processed videos
        uses: actions/upload-artifact@v4
        with:
          name: processed-hockey-videos
          path: videos/*.mp4
          if-no-files-found: warn
          retention-days: 7
