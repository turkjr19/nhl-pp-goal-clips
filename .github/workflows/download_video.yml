
name: Download and Process Hockey Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Brightcove video URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # 1. Get repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 3. Install yt-dlp
      - name: Install yt-dlp
        run: |
          sudo curl -L \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      # 4. Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # 5. Extract Brightcove video ID
      - name: Get video ID
        id: video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          VIDEO_ID=$(printf '%s' "$VIDEO_URL" | sed -n 's/.*[?&]videoId=\([^&]*\).*/\1/p')

          if [ -z "$VIDEO_ID" ]; then
            echo "Could not find Brightcove video ID"
            exit 1
          fi

          echo "video_id=$VIDEO_ID" >> "$GITHUB_OUTPUT"
          echo "Processing video: $VIDEO_ID"

      # 6. Run R video processing
      - name: Download and trim video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_ID: ${{ steps.video.outputs.video_id }}
        run: |
          Rscript video_processing.R

      # 7. Save MP4 permanently in GitHub
      - name: Commit processed video
        env:
          VIDEO_ID: ${{ steps.video.outputs.video_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "videos/${VIDEO_ID}.mp4"

          if git diff --cached --quiet; then
            echo "No new video changes to commit"
          else
            git commit -m "Add processed hockey video ${VIDEO_ID}"
            git push
          fi

      # 8. Also provide downloadable artifact
      - name: Upload processed video
        uses: actions/upload-artifact@v4
        with:
          name: processed-hockey-video
          path: videos/${{ steps.video.outputs.video_id }}.mp4
          if-no-files-found: error
          retention-days: 7
