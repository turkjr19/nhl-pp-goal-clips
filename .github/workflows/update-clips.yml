
name: Update NHL Power Play Clips

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/Toronto"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clips:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("curl", "httr2", "jsonlite"), repos = "https://cloud.r-project.org")'
          Rscript -e 'stopifnot(requireNamespace("curl", quietly=TRUE), requireNamespace("httr2", quietly=TRUE), requireNamespace("jsonlite", quietly=TRUE))'

      - name: Run NHL clip collection script
        run: Rscript get_ppGoals_URL.R

      - name: Save updated CSV to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update NHL power-play goal clips"
          file_pattern: pp_goal_clips.csv
